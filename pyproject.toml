[build-system]
requires = [
  "setuptools>=69",
  "wheel",
  "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "flightrl"
version = "0.1.0"
description = "Local-first autonomy co-design stack for simulation, training, and edge deployment."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "gymnasium>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
robotics = ["mujoco==3.10.0", "mcap==1.3.1", "websockets==15.0.1", "opencv-python-headless==4.11.0.86"]
realism = ["websockets==15.0.1", "opencv-python-headless==4.11.0.86", "scipy>=1.13", "torch>=2.8"]
reconstruction = ["opencv-python-headless==4.11.0.86", "scipy>=1.13"]
dev = [
  "plotly>=6",
  "pytest>=8.0",
  "torch>=2.8",
]
hardware = [
  "cflib>=0.1.32,<0.2",
  "Pillow>=10",
]
semantic = [
  "Pillow>=10",
  "torch>=2.8",
  "transformers>=5,<6",
]
mujoco = [
  "mujoco>=3.2",
]
tracking = [
  "wandb>=0.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightrl = ["native/*.c", "native/*.h", "native/*.inc", "native/*.metal", "native/realism/*.cpp", "native/realism/*.h", "native/realism/CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
