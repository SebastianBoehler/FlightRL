[build-system]
requires = [
  "setuptools>=69",
  "wheel",
  "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "flightrl"
version = "0.1.0"
description = "High-throughput planar drone RL simulator built with C and PufferLib Ocean-style bindings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "gymnasium>=0.29",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "plotly>=6",
  "pytest>=8.0",
]
hardware = [
  "cflib>=0.1.32,<0.2",
  "Pillow>=10",
]
semantic = [
  "Pillow>=10",
  "torch>=2.8",
  "transformers>=5,<6",
]
mujoco = [
  "mujoco>=3.2",
]
tracking = [
  "wandb>=0.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
