[radio]
uri = "radio://0/80/2M/E7E7E7E7E7"
cache_dir = "artifacts/cflib_cache"

[safety]
default_height_m = 0.3
velocity_m_s = 0.15
turn_rate_deg_s = 45.0
turn_angle_deg = 20.0
hover_s = 2.0
max_flight_s = 20.0
requires_manual_confirm = true

[decks]
expect_flow_deck = true
expect_multiranger = true

[logging]
period_ms = 50
output_dir = "artifacts/crazyflie_logs"
variables = [
  "pm.vbat",
  "pm.vbatMV",
  "pm.batteryLevel",
  "pm.state",
  "pm.chargeCurrent",
  "pm.extVbat",
  "pm.extVbatMV",
  "pm.extCurr",
  "radio.rssi",
  "radio.isConnected",
  "radio.numRxUc",
  "radio.numRxBc",
  "supervisor.info",
  "sys.canfly",
  "sys.isFlying",
  "sys.isTumbled",
  "rpm.m1",
  "rpm.m2",
  "rpm.m3",
  "rpm.m4",
  "motor.m1",
  "motor.m2",
  "motor.m3",
  "motor.m4",
  "motor.m1req",
  "motor.m2req",
  "motor.m3req",
  "motor.m4req",
  "health.motorPass",
  "health.batteryPass",
  "health.batterySag",
  "health.motorTestCount",
  "health.motorVarXM1",
  "health.motorVarXM2",
  "health.motorVarXM3",
  "health.motorVarXM4",
  "health.motorVarYM1",
  "health.motorVarYM2",
  "health.motorVarYM3",
  "health.motorVarYM4",
  "gyro.xRaw",
  "gyro.yRaw",
  "gyro.zRaw",
  "gyro.xVariance",
  "gyro.yVariance",
  "gyro.zVariance",
  "pid_rate.roll_outP",
