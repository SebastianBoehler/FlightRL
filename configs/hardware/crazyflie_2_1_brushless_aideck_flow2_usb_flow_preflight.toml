[radio]
uri = "usb://0"
cache_dir = "artifacts/cflib_cache_usb_flow_preflight"

[safety]
default_height_m = 0.3
velocity_m_s = 0.15
turn_rate_deg_s = 45.0
turn_angle_deg = 20.0
hover_s = 2.0
max_flight_s = 20.0
requires_manual_confirm = true

[decks]
expect_flow_deck = true
expect_multiranger = false
expect_ai_deck = true
expect_zranger = true

[logging]
period_ms = 50
output_dir = "artifacts/crazyflie_logs"
variables = [
  "motion.motion",
  "motion.deltaX",
  "motion.deltaY",
  "motion.squal",
  "range.zrange",
]
