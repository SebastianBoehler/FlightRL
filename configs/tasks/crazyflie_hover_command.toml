[environment]
dt = 0.02
num_envs = 512
action_mode = "hover_command"
reset_mode = "random_uniform"

[drone]
mass = 0.035
inertia = 0.00003
arm_length = 0.046
drag = 0.05
angular_drag = 0.03
gravity = 9.81
hover_thrust = 0.34335
thrust_gain = 0.16
max_total_thrust = 0.75
max_pitch_torque = 0.015
actuator_tau = 0.06
max_velocity = 0.45
max_pitch_rate = 8.0
max_pitch_angle = 0.9
floor_z = 0.0
x_limit = 2.0
z_limit = 2.0

[sensors]
include_position = false
include_velocity = false
include_attitude = false
include_angular_velocity = false
include_target_vector = false
include_previous_action = false
include_health = false
include_ideal_state = false
include_noisy_state = false
include_imu = false
include_range_sensor = true
include_crazyflie_telemetry = true
state_noise_std = 0.01
imu_noise_std = 0.02

[task]
task_type = "hover"
max_steps = 384
hover_hold_steps = 32
success_radius = 0.25
hover_speed_threshold = 0.25
fixed_start = [0.0, 0.50]
fixed_target = [0.0, 0.50]
fixed_waypoints = [[0.0, 0.50], [0.0, 0.50], [0.0, 0.50], [0.0, 0.50]]
spawn_bounds = [-0.6, 0.6, 0.25, 0.75]
target_bounds = [-0.2, 0.2, 0.35, 0.65]

[reward]
alive_bonus = 0.04
distance_penalty = 0.25
progress_bonus = 0.8
velocity_penalty = 0.08
angular_rate_penalty = 0.05
control_penalty = 0.01
smoothness_penalty = 0.03
success_bonus = 8.0
crash_penalty = 10.0
out_of_bounds_penalty = 6.0

[training]
device = "cpu"
total_timesteps = 131072
batch_size = 4096
bptt_horizon = 32
minibatch_size = 1024
max_minibatch_size = 4096
learning_rate = 0.0003
iterations = 6
checkpoint_interval = 3
hidden_size = 128

[domain_randomization]
enabled = true
mass_scale = 0.08
drag_scale = 0.15
thrust_scale = 0.12
actuator_tau_scale = 0.2
sensor_noise_scale = 0.5

[logging]
report_interval = 8
trajectory_dir = "artifacts/trajectories"

[wind]
enabled = true
steady_x = 0.0
steady_z = 0.0
gust_strength = 0.08
gust_tau = 0.4
