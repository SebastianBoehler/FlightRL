  "pid_rate.roll_outD",
  "pid_rate.roll_outFF",
  "pid_rate.pitch_outP",
  "pid_rate.pitch_outI",
  "pid_rate.pitch_outD",
  "pid_rate.pitch_outFF",
  "pid_rate.yaw_outP",
  "pid_rate.yaw_outI",
  "pid_rate.yaw_outD",
  "pid_rate.yaw_outFF",
  "pid_attitude.roll_outP",
  "pid_attitude.roll_outI",
  "pid_attitude.roll_outD",
  "pid_attitude.roll_outFF",
  "pid_attitude.pitch_outP",
