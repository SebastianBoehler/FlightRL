name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
      WANDB_MODE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install headless rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.8"

      - name: Install package
        run: python -m pip install -e ".[dev,hardware,mujoco,semantic,tracking]"

      - name: Run tests
        run: python -m pytest

      - name: Run smoke test
        run: python scripts/smoke_test.py --config configs/tasks/hover.toml --steps 8
